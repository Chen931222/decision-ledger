modules:
  jira:issuePanel:
    - key: decision-ledger-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: Decision Ledger
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  jira:globalPage:
    - key: decision-ledger-page
      resource: page
      resolver:
        function: page-resolver
      render: native
      title: Decision Ledger
  rovo:agent:
    - key: decision-ledger-agent
      name: Decision Ledger
      description: Answers questions about the team's recorded decisions, from the Decision Ledger.
      prompt: resource:agent-prompt;prompt.md
      conversationStarters:
        - Is DL-3 still in force?
        - Can PAY cache refund sessions in MongoDB?
      actions:
        - explain-decision
        - check-proposal
  action:
    - key: explain-decision
      name: Explain a decision
      function: rovo-explain
      actionVerb: GET
      description: Look up one recorded decision by its id (like DL-3) and say whether it is still in force or what superseded it.
      inputs:
        decisionId:
          title: Decision id
          type: string
          required: true
          description: The decision id, for example DL-3.
    - key: check-proposal
      name: Check a proposal against decisions
      function: rovo-check
      actionVerb: GET
      description: Check whether a proposed piece of work in a Jira project conflicts with any decision still in force there.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: The Jira project key, for example PAY.
        proposal:
          title: Proposal
          type: string
          required: true
          description: A short description of the proposed work.
  trigger:
    - key: decision-from-comment
      function: on-comment
      events:
        - avi:jira:commented:issue
      filter:
        ignoreSelf: true
  function:
    - key: resolver
      handler: index.handler
    - key: on-comment
      handler: triggers.onComment
    - key: page-resolver
      handler: page-resolver.handler
    - key: rovo-explain
      handler: rovo.explainDecision
    - key: rovo-check
      handler: rovo.checkProposal
  sql:
    - key: main
      engine: mysql
resources:
  - key: main
    path: src/frontend/index.jsx
  - key: page
    path: src/frontend/page.jsx
  - key: agent-prompt
    path: src/prompts
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/3700daed-8bb8-4b19-9ef0-7952da4090ee
