modules:
  jira:issuePanel:
    - key: decision-ledger-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: Decision Ledger
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  jira:globalPage:
    - key: decision-ledger-page
      resource: page
      resolver:
        function: page-resolver
      render: native
      title: Decision Ledger
  trigger:
    - key: decision-from-comment
      function: on-comment
      events:
        - avi:jira:commented:issue
      filter:
        ignoreSelf: true
  function:
    - key: resolver
      handler: index.handler
    - key: on-comment
      handler: triggers.onComment
    - key: page-resolver
      handler: page-resolver.handler
  sql:
    - key: main
      engine: mysql
resources:
  - key: main
    path: src/frontend/index.jsx
  - key: page
    path: src/frontend/page.jsx
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/3700daed-8bb8-4b19-9ef0-7952da4090ee
